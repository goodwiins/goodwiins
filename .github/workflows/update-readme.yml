name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - template.md
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: goodwiins/octoprofile
          path: .octoprofile

      - name: Build octoprofile
        run: swift build -c release --package-path .octoprofile

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .octoprofile/.build/release/octoprofile template.md -o README.md

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README from template"
          git push
