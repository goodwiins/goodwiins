name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - template.md
      - .github/workflows/update-readme.yml

permissions:
  contents: read

jobs:
  # Builds and runs octoprofile with a read-only token and no stored git credentials.
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: goodwiins/octoprofile
          path: .octoprofile
          persist-credentials: false

      - name: Build octoprofile
        run: swift build -c release --package-path .octoprofile

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .octoprofile/.build/release/octoprofile template.md -o README.md

      - uses: actions/upload-artifact@v4
        with:
          name: readme
          path: README.md

  # Commits the generated README; never executes octoprofile.
  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: readme

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README from template"
          git push
